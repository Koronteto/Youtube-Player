<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="utf-8">
        <title>YP</title>
        <style>
            button {cursor: pointer}
            input {cursor: pointer;}
            body {background: linear-gradient(to bottom, mistyrose, #ff3333); background-repeat: no-repeat; min-height: 100vh; font-family: "Zen Maru Gothic", sans-serif; font-weight: 400; }
            button:hover {background-color: #ff5555;}
            button:active {background-color: white;}
            a:hover {color: rebeccapurple;}
            .ecosiaLink {color: yellowgreen;}
            .input {border-radius: 8px; margin: 8px; padding: 4px 8px;}
            .button {border: none; background-color: #ff3333; color: mistyrose; border-radius: 8px; padding: 4px 8px;}
            .redColor {color: #ff3333; accent-color: #ff3333;}
            .inputBack {background-color: white; border-radius: 10px; padding: 10px; margin: 8px; }
            .formButtonContain {position: fixed; top: 10px; right: 10px; z-index: 1000;}
            .formLinkButton {padding: 2px 8px; display: inline-block;}
            .screen {display: block; margin: 0 auto; border-style: solid; border-color: mistyrose; border: 2px dashed mistyrose; box-shadow: 0px 0px 10px 0px black ;}
        </style>
        <!--<link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic&display=swap" rel="stylesheet">-->
    </head>
    <body>
        <!--
        <iframe width="560" height="315" src="https://www.youtube.com/embed/nFHPwsIuwW0?si=kw-HFsM_kWJIOrPY" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
        -->
        <h2>Youtube Player</h2>
        <p>※注：<b>Google以外で動画を検索！</b>　例：<a href="http://ecosia.com/" target="_blank" rel="noopener noreferrer" class="ecosiaLink">Ecosiaで検索</a></p>
        <div class="inputBack">
            <div>
                <label for="IN_URL">動画URL</label>
                <input type="text" placeholder="https://www.youtube.com/watch?v=xxxxxxxxxxx" id="IN_URL" class="input">
                <button type="button" class="button" id="byUrlButton">OK</button>
            </div>
            <div>
                <label for="IN_ID">動画ID</label>
                <input type="text" placeholder="xxxxxxxxxxx" id="IN_ID" class="input">
                <button type="button" class="button" id="byIdButton">OK</button>
            </div>
            <div>
            <span>動画サイズ</span>
            <label for="widthValue">横：</label><input type="range" max="1000" min="1" value="560" id="widthValue" class="redColor input"><span id="widthValueLabel"></span>
            <label for="heightValue">縦</label><input type="range" max="1000" min="1" value="315" id="heightValue" class="redColor input"><span id="heightValueLabel"></span>
            <button class="button" id="resetScreenSize">画面サイズをリセット</button>
        </div>
        </div>
        
        <div class="formButtonContain">
            <a href="https://forms.gle/2pUqkiG17ZaAFPwx9" target="_blank" rel="noopener noreferrer" class="formLinkButton button">改善点はぜひここに！</a>
        </div>
        <div><iframe src="" id="screen" allowfullscreen frameborder=0 width="560" height="315" class="screen"></iframe></div>
        
        <script>
            const IN_ID = document.getElementById("IN_ID");
            const IN_URL = document.getElementById("IN_URL");
            const screen = document.getElementById("screen");
            function inputClear() {IN_ID.value = ''; IN_URL.value = '';};
            function cautionInput() {alert("入力が正しくありません")};
            function setSizeValue() {
                document.getElementById("widthValueLabel").textContent = `${screen.width}`;
                document.getElementById("heightValueLabel").textContent = `${screen.height}`;
            };
            const openUseId = (videoId) => {
                screen.src = `https://www.youtube.com/embed/${videoId}`;
                inputClear();
            };
            const byId = () => {
                if (IN_ID.value) {
                    openUseId(IN_ID.value);
                } else {cautionInput()}
            };
            const byUrl = () => {
                if (IN_URL.value) {
                    let getId = IN_URL.value.split("?v=")[1];
                    getId = getId.split("&")[0];
                    openUseId(getId);
                } else {cautionInput()}
            };
            function changeSize() {
                screen.width = document.getElementById("widthValue").value;
                screen.height = document.getElementById("heightValue").value;
                setSizeValue();
            };
            function setScreenSize() {
                const widthRange = document.getElementById("widthValue");
                const heightRange = document.getElementById("heightValue");
                let windowWidthMax = Math.round(window.innerWidth * 0.3);
                let windowHeightMax = Math.round(window.innerHeight * 0.3);
                widthRange.max = window.innerWidth - (window.innerWidth * 0.03);
                heightRange.max = window.innerHeight - (window.innerHeight * 0.1);
                widthRange.value = windowWidthMax;
                heightRange.value = windowHeightMax;
                screen.width = windowWidthMax;
                screen.height = windowHeightMax;
                setSizeValue();
            };
            setScreenSize();
            document.getElementById("byUrlButton").addEventListener("click", byUrl);
            document.getElementById("byIdButton").addEventListener("click", byId);
            document.getElementById("widthValue").addEventListener("input", changeSize);
            document.getElementById("heightValue").addEventListener("input", changeSize);
            document.getElementById("resetScreenSize").addEventListener("click", setScreenSize);
        </script>
    </body>
</html>
