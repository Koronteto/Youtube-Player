<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="utf-8">
        <title>YP</title>
        <style>
            body {font-family: "Zen Maru Gothic", sans-serif; font-weight: 500;}
            button:hover {background-color: #ffaaaa; cursor: pointer;}
            button:active {background-color: #aa1111; cursor: pointer;}
            html {background: linear-gradient(to bottom, mistyrose, #ff3333); background-repeat: no-repeat; min-height: 100%;}
            .roundBorder {border-radius: 8px;}
            .button {border: none; background-color: #ff3333;}
        </style>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic&display=swap" rel="stylesheet">
    </head>
    <body>
        <!--
        <iframe width="560" height="315" src="https://www.youtube.com/embed/nFHPwsIuwW0?si=kw-HFsM_kWJIOrPY" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
        -->
        <h2>Youtube Player</h2>
        <span>※注：</span><b>Google以外で動画を検索</b><span>　例：</span>
        <a href="http://ecosia.com/" target="_blank" rel="noopener noreferrer" style="color: #00cc33;">ecosiaで検索</a>
        <div>
        <input type="text" placeholder="動画URL" id="IN_URL" class="roundBorder">
        <button type="button" class="button roundBorder" id="byUrlButton">OK</button>
        <input type="text" placeholder="動画ID" id="IN_ID" class="roundBorder">
        <button type="button" class="button roundBorder" id="byIdButton">OK</button>
        <span>動画サイズ：</span>
        <span id="widthValueShow">横</span><input type="range" max="1000" min="0" value="560" id="widthValue">
        <span id="heightValueShow">縦</span><input type="range" max="1000" min="0" value="315" id="heightValue">
        <!-- <button onclick="changeSize();" class="button roundBorder">OK</button> -->
        </div>
        <div>
            <button type="button" onclick="inputClear();" class="button roundBorder">リセット</button>
        </div>
        <br>
        <iframe src="" id="screen" allowfullscreen frameborder="1" width="560" height="315" style="display: block; margin: 0 auto; border-style: solid; border-color: white;"></iframe>
        <script>
            const openUseId = (videoId) => {
                const screen = document.getElementById("screen");
                screen.src = `https://www.youtube.com/embed/${videoId}`;
            };
            const byId = () => {
                const IN_ID = document.getElementById("IN_ID").value;
                openUseId(IN_ID);
            };
            const byUrl = () => {
                const IN_URL = document.getElementById("IN_URL").value;
                let getId = IN_URL.split("?v=")[1];
                getId = getId.split("&")[0];
                openUseId(getId);
            };
            function changeSize() {
                const screen = document.getElementById("screen");
                screen.width = document.getElementById("widthValue").value;
                screen.height = document.getElementById("heightValue").value;
            };
            function inputClear() {
                const IN_ID = document.getElementById("IN_ID");
                const IN_URL = document.getElementById("IN_URL");
                IN_ID.value = '';
                IN_URL.value = '';
            };
            function setScreenSize() {
                const width = document.getElementById("widthValue");
                const height = document.getElementById("heightValue");
                width.max = window.innerWidth - 30;
                height.max = window.innerHeight - 40;
                const screen = document.getElementById("screen");
                screen.width = window.innerWidth * 0.3
                screen.height = window.innerHeight * 0.3
            };
            setScreenSize();
            document.getElementById("byUrlButton").addEventListener("click", byUrl);
            document.getElementById("byIdButton").addEventListener("click", byId);
            document.getElementById("widthValue").addEventListener("input", changeSize);
            document.getElementById("heightValue").addEventListener("input", changeSize);
        </script>
    </body>
</html>
