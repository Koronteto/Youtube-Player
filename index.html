<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="utf-8">
        <title>YP</title>
        <style>
            button, input {cursor: pointer;}
            body {
                background: linear-gradient(to bottom, mistyrose, #ff3333);
                background-repeat: no-repeat; min-height: 100vh;
                font-family: "Zen Maru Gothic", sans-serif;
                font-weight: 400;
            }
            button:hover {background-color: #ff5555;}
            button:active {background-color: white;}
            a:hover {color: rebeccapurple;}
            .ecosiaLink {color: yellowgreen;}
            .input {border: 1px solid #ff3333; border-radius: 8px; padding: 8px;}
            .button {border: none; background-color: #ff3333; color: mistyrose; border-radius: 8px; padding: 8px 12px;} 
            .redColor {color: #ff3333; accent-color: #ff3333;}
            .inputBack {background-color: white; border-radius: 10px; padding: 10px; margin: 8px 100px; }
            .inputFlex {display: flex; gap: 10px; align-items: center; margin: 8px 0px;}
            .inputFlex input {flex-grow: 1;}
            .inputFlex label {flex-basis: 80px;}
            .rangeFlex {display: flex; align-items: center; gap: 10px; margin: 8px 0px;}
            .rangeFlex input {flex-grow: 1;}
            .formButtonContain {position: fixed; top: 10px; right: 10px; z-index: 100;}
            .formLinkButton {padding: 4px 8px; display: inline-block;}
            .screen {display: block; margin: 0 auto; border: 1.5px dashed mistyrose; box-shadow: 0px 0px 10px 0px #00000050; border-radius: 2px;}
            .fullscreened {position:fixed; z-index:999; left:0; top:0;}
        </style>
        <!--<link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic&display=swap" rel="stylesheet">-->
    </head>
    <body>
        <!--
        <iframe width="560" height="315" src="https://www.youtube.com/embed/nFHPwsIuwW0?si=kw-HFsM_kWJIOrPY" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
        -->
        <h2>Youtube Player</h2>
        <p>※注：<b>Google以外で動画を検索！</b>　例：<a href="http://ecosia.com/" target="_blank" rel="noopener noreferrer" class="ecosiaLink">Ecosiaで検索</a></p>
        <div class="inputBack">
            <div class="inputFlex">
                <label for="IN_URL">動画URL</label>
                <input type="text" placeholder="https://www.youtube.com/watch?v=xxxxxxxxxxx" id="IN_URL" class="input">
                <button type="button" id="byUrlButton" class="button">OK</button>
            </div>
            <div class="inputFlex">
                <label for="IN_ID">動画ID</label>
                <input type="text" placeholder="xxxxxxxxxxx" id="IN_ID" class="input">
                <button type="button" class="button" id="byIdButton">OK</button>
            </div>
            <details>
                <summary>詳細</summary>
                    <div class="rangeFlex">
                        動画サイズ
                        <label for="widthValue">横：</label>
                        <input type="range" max="1000" min="1" value="560" id="widthValue" class="redColor">
                        <span id="widthValueLabel"></span>
                        <label for="heightValue">縦：</label>
                        <input type="range" max="1000" min="1" value="315" id="heightValue" class="redColor">
                        <span id="heightValueLabel"></span>
                        <button class="button" id="resetScreenSize">サイズリセット</button>
                    </div>
                    <div class="rangeFlex">
                        時間<br>(0でなし)
                        <label for="startTime">開始</label>
                        <input type="number" min="0" id="startTime" value="0" class="input">
                        <label for="endTime">停止</label>
                        <input type="number" min="0" id="endTime" value="0" class="input">
                    </div>
            </details>
        </div>
        <div class="formButtonContain">
            <a href="https://forms.gle/2pUqkiG17ZaAFPwx9" target="_blank" rel="noopener noreferrer" class="formLinkButton button">改善点はぜひここに！</a>
        </div>
        <div><iframe src="" id="screen" allowfullscreen frameborder="0" width="560" height="315" class="screen"></iframe></div>
        
        <script>
            const IN_ID = document.getElementById("IN_ID");
            const IN_URL = document.getElementById("IN_URL");
            const SCREEN = document.getElementById("screen");
            const END_TIME = document.getElementById("endTime");
            const START_TIME = document.getElementById("startTime");
            const URLPARAMS = new URLSearchParams(window.location.search);
            const debounce = (fn, delay) => {
                let timer;
                return function (...args) {
                    clearTimeout(timer);
                    timer = setTimeout(() => {fn.apply(this, args);}, delay);
                }
            }
            function inputClear() {IN_ID.value = ''; IN_URL.value = '';};
            function cautionInput() {alert("入力が正しくありません")};
            function setSizeValue() {
                document.getElementById("widthValueLabel").textContent = `${SCREEN.width}`;
                document.getElementById("heightValueLabel").textContent = `${SCREEN.height}`;
            }
            function openUseId(videoId,s,e) {
                SCREEN.src = `https://www.youtube.com/embed/${videoId}?start=${s}&end=${e}`;
                inputClear();
            }
            function byId() {
                if (IN_ID.value) {
                    openUseId(IN_ID.value,START_TIME.value,END_TIME.value);
                }
                else {cautionInput();}
            }
            function byUrl() {
                if (IN_URL.value) {
                    let getId = IN_URL.value.split("?v=")[1];
                    getId = getId.split("&")[0];
                    openUseId(getId,START_TIME.value,END_TIME.value);
                }
                else {cautionInput();}
            }
            function changeSize() {
                SCREEN.width = document.getElementById("widthValue").value;
                SCREEN.height = document.getElementById("heightValue").value;
                setSizeValue();
            }
            function setScreenSize() {
                if (!URLPARAMS.get("v") && !URLPARAMS.get("vurl")) {
                    alert();
                    const widthRange = document.getElementById("widthValue");
                    const heightRange = document.getElementById("heightValue");
                    let windowHeight = Math.round(window.innerHeight * 0.3);
                    let windowWidth = Math.round(window.innerWidth * 0.3);
                    widthRange.value = windowWidth;
                    heightRange.value = windowHeight;
                    widthRange.max = window.innerWidth * 0.97;
                    heightRange.max = window.innerHeight * 0.9;
                    changeSize();
                    setSizeValue();
                }
            }
            setScreenSize();
            if (URLPARAMS.get("v")) {
                openUseId(URLPARAMS.get("v"),URLPARAMS.get("s"),URLPARAMS.get("e"));
            }
            else if (URLPARAMS.get("vurl")) {
                let getId = URLPARAMS.get("vurl").split("?v=")[1];
                getId = getId.split("&")[0];
                openUseId(getId,URLPARAMS.get("s"),URLPARAMS.get("e"));
            }
            if (URLPARAMS.get("v") || URLPARAMS.get("vurl")) {
                SCREEN.classList.add("fullscreened");
                const widthRange = document.getElementById("widthValue");
                const heightRange = document.getElementById("heightValue");
                widthRange.max = window.innerWidth;
                heightRange.max = window.innerHeight;
                widthRange.value = window.innerWidth;
                heightRange.value = window.innerHeight;
                changeSize();
            }
            document.getElementById("byUrlButton").addEventListener("click", byUrl);
            document.getElementById("byIdButton").addEventListener("click", byId);
            document.getElementById("widthValue").addEventListener("input", changeSize);
            document.getElementById("heightValue").addEventListener("input", changeSize);
            document.getElementById("resetScreenSize").addEventListener("click", setScreenSize);
            window.addEventListener("resize", debounce(setScreenSize, 100));
        </script>
    </body>
</html>
